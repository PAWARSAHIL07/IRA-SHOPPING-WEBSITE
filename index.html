<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IRA 3D Creations - Custom 3D Printed Art</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f0f15;
            --card-bg: #1a1a24;
            --accent: #00f2ea;
            --accent-secondary: #ff0055;
            --text-light: #ffffff;
            --text-dim: #a0a0b0;
            --success: #25d366;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-light);
            overflow-x: hidden;
            padding-bottom: 80px; /* Space for bottom nav */
        }

        h1, h2, h3 {
            font-family: 'Space Grotesk', sans-serif;
        }

        /* Tactile Button Effects */
        button, .cta {
            cursor: pointer;
            border: none;
            transition: transform 0.1s ease, box-shadow 0.1s ease;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
        }

        button:active, .cta:active {
            transform: scale(0.96);
        }

        /* Header */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 15px 20px;
            background: rgba(15, 15, 21, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .logo {
            font-size: 1.2rem;
            font-weight: 800;
            background: linear-gradient(45deg, var(--accent), var(--accent-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .cart-icon {
            position: relative;
            background: var(--card-bg);
            padding: 10px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .cart-count {
            position: absolute;
            top: -5px;
            right: -5px;
            background: var(--accent-secondary);
            color: white;
            font-size: 0.7rem;
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            font-weight: bold;
        }

        /* Hero Section */
        .hero {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 20px;
            position: relative;
            background: radial-gradient(circle at 50% 30%, rgba(0, 242, 234, 0.1), transparent 60%);
        }

        .hero h1 {
            font-size: 3rem;
            line-height: 1.1;
            margin-bottom: 20px;
        }

        .hero h1 span {
            color: var(--accent);
        }

        .hero p {
            color: var(--text-dim);
            font-size: 1.1rem;
            max-width: 400px;
            margin-bottom: 30px;
        }

        .cta-main {
            background: linear-gradient(45deg, var(--accent), #00b8b3);
            color: #000;
            padding: 15px 40px;
            border-radius: 50px;
            font-size: 1.1rem;
            text-decoration: none;
            box-shadow: 0 10px 20px rgba(0, 242, 234, 0.3);
        }

        /* Products Grid */
        .products-section {
            padding: 40px 20px;
        }

        .section-title {
            font-size: 1.8rem;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-title::before {
            content: '';
            width: 4px;
            height: 24px;
            background: var(--accent-secondary);
            border-radius: 2px;
        }

        .products-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        .product-card {
            background: var(--card-bg);
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.05);
            transition: transform 0.2s;
        }

        .product-card:active {
            transform: scale(0.98);
        }

        .product-img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            background: #000;
        }

        .product-info {
            padding: 15px;
        }

        .product-name {
            font-size: 1.1rem;
            margin-bottom: 5px;
        }

        .product-desc {
            font-size: 0.8rem;
            color: var(--text-dim);
            margin-bottom: 15px;
            min-height: 35px;
        }

        .product-bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .price {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--accent);
        }

        .add-btn {
            background: var(--accent-secondary);
            color: white;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 0.9rem;
        }

        /* Bottom Sheet / Cart Drawer */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 200;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .drawer {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            max-height: 85vh;
            background: #15151e;
            border-radius: 20px 20px 0 0;
            z-index: 300;
            transform: translateY(100%);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            flex-direction: column;
            border-top: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 -10px 30px rgba(0,0,0,0.5);
        }

        .drawer.active {
            transform: translateY(0);
        }

        .drawer-handle {
            width: 40px;
            height: 5px;
            background: rgba(255,255,255,0.2);
            border-radius: 5px;
            margin: 10px auto;
        }

        .drawer-content {
            padding: 20px;
            overflow-y: auto;
        }

        .drawer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .close-btn {
            background: rgba(255,255,255,0.1);
            width: 32px;
            height: 32px;
            border-radius: 50%;
            color: white;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .qty-controls {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255,255,255,0.05);
            padding: 5px;
            border-radius: 10px;
        }

        .qty-btn {
            background: transparent;
            color: var(--accent);
            width: 24px;
            height: 24px;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .checkout-btn {
            background: var(--success);
            color: #000;
            width: 100%;
            padding: 18px;
            border-radius: 12px;
            font-size: 1.1rem;
            margin-top: 20px;
            box-shadow: 0 10px 20px rgba(37, 211, 102, 0.3);
        }

        /* Form Elements */
        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-size: 0.8rem;
            color: var(--text-dim);
            margin-bottom: 5px;
        }

        .form-input {
            width: 100%;
            background: var(--card-bg);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 15px;
            border-radius: 10px;
            color: white;
            font-family: 'Outfit', sans-serif;
            font-size: 1rem;
            outline: none;
            transition: border 0.2s;
        }

        .form-input:focus {
            border-color: var(--accent);
        }

        .empty-cart {
            text-align: center;
            color: var(--text-dim);
            padding: 40px 0;
        }

        /* Desktop Tweaks */
        @media (min-width: 768px) {
            .hero h1 { font-size: 4.5rem; }
            .products-grid {
                grid-template-columns: repeat(3, 1fr);
            }
            .drawer {
                max-width: 450px;
                left: auto;
                right: 0;
                border-radius: 20px 0 0 0;
                height: 100vh;
                max-height: 100vh;
                transform: translateX(100%);
            }
            .drawer.active {
                transform: translateX(0);
            }
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="logo">IRA 3D CREATIONS</div>
        <div class="cart-icon" onclick="toggleCart()">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
            <span class="cart-count" id="cartCount" style="display: none;">0</span>
        </div>
    </header>

    <!-- Hero -->
    <section class="hero">
        <h1>Bringing Ideas to <span>Reality</span></h1>
        <p>Premium custom 3D printed products. Quality you can touch, designs you'll love.</p>
        <a href="#products" class="cta-main">Explore Collection</a>
    </section>

    <!-- Products -->
    <section class="products-section" id="products">
        <h2 class="section-title">Our Collection</h2>
        <div class="products-grid" id="productGrid">
            <!-- Products will be injected by JS -->
        </div>
    </section>

    <!-- Cart Overlay & Drawer -->
    <div class="overlay" id="overlay" onclick="closeAll()"></div>
    <div class="drawer" id="cartDrawer">
        <div class="drawer-handle"></div>
        <div class="drawer-content">
            <div class="drawer-header">
                <h3>Your Cart</h3>
                <button class="close-btn" onclick="closeAll()">X</button>
            </div>
            <div id="cartItems"></div>
            <div id="cartTotalContainer" style="display: none; margin-top: 20px; text-align: right;">
                <h3>Total: ₹<span id="cartTotal">0</span></h3>
                <button class="checkout-btn" onclick="showCheckoutForm()">Proceed to Checkout</button>
            </div>
        </div>
    </div>

    <!-- Checkout Form Drawer -->
    <div class="drawer" id="checkoutDrawer">
        <div class="drawer-handle"></div>
        <div class="drawer-content">
            <div class="drawer-header">
                <h3>Delivery Details</h3>
                <button class="close-btn" onclick="closeAll()">X</button>
            </div>
            <form id="checkoutForm" onsubmit="sendToWhatsApp(event)">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" class="form-input" id="custName" required placeholder="John Doe">
                </div>
                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="tel" class="form-input" id="custPhone" required placeholder="9876543210">
                </div>
                <div class="form-group">
                    <label>Delivery Address</label>
                    <textarea class="form-input" id="custAddress" rows="4" required placeholder="House No, Street, City, Pincode"></textarea>
                </div>
                <button type="submit" class="checkout-btn" style="margin-top: 10px;">
                    <svg style="vertical-align: middle; margin-right: 8px;" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.247-.694.247-1.289.173-1.413z"/></svg>
                    Place Order via WhatsApp
                </button>
            </form>
        </div>
    </div>

    <script>
        // Product Data
        const products = [
            { id: 1, name: "Articulated Dragon", desc: "Flexible print-in-place model", price: 450, img: "https://images.unsplash.com/photo-1611162617213-7d7a39e9b73d?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80" },
            { id: 2, name: "Geometric Planter", desc: "Modern design for succulents", price: 300, img: "https://images.unsplash.com/photo-1485955900006-10f4d324d411?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80" },
            { id: 3, name: "Custom Keychain", desc: "Personalized with your name", price: 150, img: "https://images.unsplash.com/photo-1606760227091-3dd870d97f1d?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80" },
            { id: 4, name: "Desk Lamp Vader", desc: "LED ready geometric lamp", price: 800, img: "https://images.unsplash.com/photo-1507473885765-e6ed057f782c?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80" },
            { id: 5, name: "Miniature Castle", desc: "Highly detailed tabletop decor", price: 650, img: "https://images.unsplash.com/photo-1565008447742-97f6f38c985c?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80" },
            { id: 6, name: "Cable Organizer", desc: "Neatly manage your desk cables", price: 200, img: "https://images.unsplash.com/photo-1625772452859-1c03d5bf1137?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80" }
        ];

        let cart = [];

        // Render Products
        const productGrid = document.getElementById('productGrid');
        products.forEach(p => {
            productGrid.innerHTML += `
                <div class="product-card">
                    <img src="${p.img}" alt="${p.name}" class="product-img">
                    <div class="product-info">
                        <h3 class="product-name">${p.name}</h3>
                        <p class="product-desc">${p.desc}</p>
                        <div class="product-bottom">
                            <span class="price">₹${p.price}</span>
                            <button class="add-btn" onclick="addToCart(${p.id})">Add +</button>
                        </div>
                    </div>
                </div>
            `;
        });

        // Cart Functions
        function addToCart(id) {
            const product = products.find(p => p.id === id);
            const cartItem = cart.find(item => item.id === id);
            
            if(cartItem) {
                cartItem.qty += 1;
            } else {
                cart.push({...product, qty: 1});
            }
            updateCart();
            
            // Tactile feedback - shake cart icon
            const cartIcon = document.querySelector('.cart-icon');
            cartIcon.style.transform = 'scale(1.2)';
            setTimeout(() => cartIcon.style.transform = 'scale(1)', 200);
        }

        function changeQty(id, delta) {
            let cartItem = cart.find(item => item.id === id);
            if(cartItem) {
                cartItem.qty += delta;
                if(cartItem.qty <= 0) {
                    cart = cart.filter(item => item.id !== id);
                }
            }
            updateCart();
        }

        function updateCart() {
            const cartItemsDiv = document.getElementById('cartItems');
            const cartCount = document.getElementById('cartCount');
            const cartTotalContainer = document.getElementById('cartTotalContainer');
            
            let totalQty = 0;
            let totalPrice = 0;

            if(cart.length === 0) {
                cartItemsDiv.innerHTML = '<div class="empty-cart">Your cart is empty.</div>';
                cartTotalContainer.style.display = 'none';
                cartCount.style.display = 'none';
            } else {
                cartItemsDiv.innerHTML = '';
                cart.forEach(item => {
                    totalQty += item.qty;
                    totalPrice += item.price * item.qty;
                    cartItemsDiv.innerHTML += `
                        <div class="cart-item">
                            <div>
                                <h4 style="font-size: 1rem;">${item.name}</h4>
                                <p style="color: var(--text-dim); font-size: 0.8rem;">₹${item.price}</p>
                            </div>
                            <div class="qty-controls">
                                <button class="qty-btn" onclick="changeQty(${item.id}, -1)">-</button>
                                <span>${item.qty}</span>
                                <button class="qty-btn" onclick="changeQty(${item.id}, 1)">+</button>
                            </div>
                        </div>
                    `;
                });
                cartTotalContainer.style.display = 'block';
                document.getElementById('cartTotal').innerText = totalPrice;
                cartCount.style.display = 'flex';
            }
            cartCount.innerText = totalQty;
        }

        // Drawer Controls
        function toggleCart() {
            document.getElementById('cartDrawer').classList.add('active');
            document.getElementById('overlay').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function showCheckoutForm() {
            document.getElementById('cartDrawer').classList.remove('active');
            document.getElementById('checkoutDrawer').classList.add('active');
            document.getElementById('overlay').classList.add('active');
        }

        function closeAll() {
            document.getElementById('cartDrawer').classList.remove('active');
            document.getElementById('checkoutDrawer').classList.remove('active');
            document.getElementById('overlay').classList.remove('active');
            document.body.style.overflow = 'auto';
        }

        // WhatsApp Integration
        function sendToWhatsApp(e) {
            e.preventDefault();
            const name = document.getElementById('custName').value;
            const phone = document.getElementById('custPhone').value;
            const address = document.getElementById('custAddress').value;
            
            let message = `*New Order - IRA 3D Creations*%0A%0A`;
            message += `*Name:* ${name}%0A`;
            message += `*Phone:* ${phone}%0A`;
            message += `*Address:* ${address}%0A%0A`;
            message += `*Order Details:*%0A`;
            
            let total = 0;
            cart.forEach(item => {
                message += `- ${item.name} x${item.qty} = ₹${item.price * item.qty}%0A`;
                total += item.price * item.qty;
            });
            
            message += `%0A*Total Amount: ₹${total}*`;
            
            // Replace 9588420626 with your number. Assuming +91 for India.
            const whatsappUrl = `https://wa.me/919588420626?text=${message}`;
            
            // Redirect to WhatsApp
            window.location.href = whatsappUrl;
            
            // Optional: Clear cart after redirect
            setTimeout(() => {
                cart = [];
                updateCart();
                closeAll();
                document.getElementById('checkoutForm').reset();
            }, 1000);
        }

        // Initialize
        updateCart();
    </script>
</body>
</html>
